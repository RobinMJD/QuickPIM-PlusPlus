name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild and publish
        required: true
        type: string
      publish_target:
        description: Publication step to retry
        required: true
        default: all
        type: choice
        options:
          - all
          - github
          - chrome
          - edge

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact tag
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tagged commit is on main
        run: |
          git fetch origin main --no-tags
          TAG_COMMIT="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          git merge-base --is-ancestor "$TAG_COMMIT" origin/main

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm

      - name: Pin npm
        run: npm install --global npm@11.6.2

      - name: Install dependencies
        run: npm ci

      - name: Verify tag and all version consumers
        run: node scripts/check-version-sync.mjs "$RELEASE_TAG"

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Audit
        run: npm audit --audit-level=low

      - name: Build
        run: npm run build

      - name: Install browser test runtime
        run: npx --no-install playwright install --with-deps chromium

      - name: Browser visual contracts
        run: npm run test:e2e

      - name: Package and verify both Store ZIPs
        run: npm run package:stores

      - name: Upload verified Store ZIP artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-store-zips-${{ env.RELEASE_TAG }}
          path: |
            release/quickpim-plusplus-v*-chrome-webstore.zip
            release/quickpim-plusplus-v*-edge-addons.zip
          if-no-files-found: error

  github-release:
    needs: verify-package
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_target == 'all' || inputs.publish_target == 'github' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified Store ZIPs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: browser-store-zips-${{ env.RELEASE_TAG }}
          path: release

      - name: Create immutable GitHub release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          ASSETS=(
            "quickpim-plusplus-v${VERSION}-chrome-webstore.zip"
            "quickpim-plusplus-v${VERSION}-edge-addons.zip"
          )
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            for ZIP in "${ASSETS[@]}"; do
              LOCAL="release/${ZIP}"
              if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "$ZIP"; then
                mkdir -p /tmp/existing-release
                gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ZIP" --dir /tmp/existing-release
                cmp "$LOCAL" "/tmp/existing-release/$ZIP" || { echo "Existing release asset differs; refusing to overwrite it." >&2; exit 1; }
              else
                gh release upload "$RELEASE_TAG" "$LOCAL" --repo "$GITHUB_REPOSITORY"
              fi
            done
          else
            gh release create "$RELEASE_TAG" "${ASSETS[@]/#/release/}" --repo "$GITHUB_REPOSITORY" --title "QuickPIM++ $RELEASE_TAG" --generate-notes --verify-tag
          fi

  chrome-web-store:
    needs: [verify-package, github-release]
    if: ${{ always() && needs.verify-package.result == 'success' && needs.github-release.result != 'failure' && (github.event_name != 'workflow_dispatch' || inputs.publish_target == 'all' || inputs.publish_target == 'chrome') }}
    runs-on: ubuntu-latest
    environment: chrome-web-store
    permissions:
      contents: read
    steps:
      - name: Checkout publisher script
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - name: Download verified Store ZIPs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: browser-store-zips-${{ env.RELEASE_TAG }}
          path: release

      - name: Publish to Chrome Web Store
        run: node scripts/publish-chrome-webstore.mjs
        env:
          CHROME_WEBSTORE_CLIENT_ID: ${{ secrets.CHROME_WEBSTORE_CLIENT_ID }}
          CHROME_WEBSTORE_CLIENT_SECRET: ${{ secrets.CHROME_WEBSTORE_CLIENT_SECRET }}
          CHROME_WEBSTORE_REFRESH_TOKEN: ${{ secrets.CHROME_WEBSTORE_REFRESH_TOKEN }}
          CHROME_WEBSTORE_PUBLISHER_ID: ${{ secrets.CHROME_WEBSTORE_PUBLISHER_ID }}
          CHROME_WEBSTORE_EXTENSION_ID: ${{ secrets.CHROME_WEBSTORE_EXTENSION_ID }}
          CHROME_WEBSTORE_ZIP: release/quickpim-plusplus-${{ env.RELEASE_TAG }}-chrome-webstore.zip

  microsoft-edge-add-ons:
    needs: [verify-package, github-release]
    if: ${{ always() && needs.verify-package.result == 'success' && needs.github-release.result != 'failure' && vars.EDGE_ADDONS_MANUAL_SUBMISSION_TAG != (github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name) && (github.event_name != 'workflow_dispatch' || inputs.publish_target == 'all' || inputs.publish_target == 'edge') }}
    runs-on: ubuntu-latest
    environment: microsoft-edge-add-ons
    permissions:
      contents: read
    steps:
      - name: Checkout publisher script
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24

      - name: Download verified Store ZIPs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: browser-store-zips-${{ env.RELEASE_TAG }}
          path: release

      - name: Publish to Microsoft Edge Add-ons
        run: node scripts/publish-edge-addons.mjs
        env:
          EDGE_ADDONS_CLIENT_ID: ${{ secrets.EDGE_ADDONS_CLIENT_ID }}
          EDGE_ADDONS_API_KEY: ${{ secrets.EDGE_ADDONS_API_KEY }}
          EDGE_ADDONS_PRODUCT_ID: ${{ secrets.EDGE_ADDONS_PRODUCT_ID }}
          EDGE_ADDONS_ZIP: release/quickpim-plusplus-${{ env.RELEASE_TAG }}-edge-addons.zip
          EDGE_ADDONS_CERTIFICATION_NOTES: ${{ vars.EDGE_ADDONS_CERTIFICATION_NOTES }}
